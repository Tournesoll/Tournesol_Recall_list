apply plugin: "com.android.application"

android {
    namespace "com.recalllite.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.recalllite.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
}
